<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esteban Gigena — Consultor en AI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --purple: #7c3aed;
      --blue: #2563eb;
      --magenta: #d946ef;
      --white: #ffffff;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0621 0%, #1a0a3d 30%, #0d1f5c 65%, #0a2a6e 100%);
      padding: 24px;
      overflow-x: hidden;
    }

    /* Animated background orbs */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #7c3aed, transparent);
      top: -100px;
      left: -100px;
      animation: float1 8s ease-in-out infinite;
    }
    body::after {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #d946ef, transparent);
      bottom: -80px;
      right: -80px;
      animation: float2 10s ease-in-out infinite;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(40px, 30px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-30px, -40px); }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 48px 40px 40px;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05) inset,
        0 32px 80px rgba(0,0,0,0.5),
        0 0 60px rgba(124,58,237,0.15);
      animation: fadeIn 0.7s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Top accent line */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #d946ef, #7c3aed, transparent);
      border-radius: 0 0 4px 4px;
    }

    /* Avatar initials */
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #d946ef);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      margin: 0 auto 24px;
      box-shadow: 0 0 0 4px rgba(217,70,239,0.25), 0 0 30px rgba(124,58,237,0.4);
      letter-spacing: -1px;
    }

    /* Name */
    h1 {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    /* Title / role */
    .role {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #d946ef, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
    }

    /* Divider */
    .divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, #7c3aed, #d946ef);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    /* Service tag */
    .service-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(124, 58, 237, 0.18);
      border: 1px solid rgba(124, 58, 237, 0.35);
      color: #c4b5fd;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 28px;
    }
    .service-tag svg {
      width: 13px;
      height: 13px;
      opacity: 0.85;
    }

    /* Target client */
    .tagline {
      font-size: 13.5px;
      color: rgba(255,255,255,0.55);
      font-weight: 400;
      line-height: 1.6;
      margin-bottom: 32px;
      padding: 0 8px;
    }

    /* Contact buttons */
    .contact-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      text-decoration: none;
      border: none;
      outline: none;
      width: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-email {
      background: linear-gradient(135deg, #7c3aed, #d946ef);
      color: #fff;
      box-shadow: 0 4px 20px rgba(124,58,237,0.4);
    }
    .btn-email:hover {
      box-shadow: 0 8px 30px rgba(217,70,239,0.5);
    }

    .btn-whatsapp {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.13);
      color: #e2e8f0;
    }
    .btn-whatsapp:hover {
      background: rgba(255,255,255,0.12);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .btn-linkedin {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.13);
      color: #e2e8f0;
    }
    .btn-linkedin:hover {
      background: rgba(255,255,255,0.12);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* Copy feedback */
    .copy-feedback {
      font-size: 12px;
      color: #a78bfa;
      height: 18px;
      margin-top: 4px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .copy-feedback.show {
      opacity: 1;
    }

    /* Footer */
    .footer {
      margin-top: 28px;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.5px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 36px 24px 32px;
      }
      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

<div class="card">

  <div class="avatar">EG</div>

  <h1>Esteban Gigena</h1>
  <p class="role">Consultor en AI</p>
  <div class="divider"></div>

  <span class="service-tag">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>

  <p class="tagline">
    Ayudo a PyMEs y profesionales a incorporar<br>

  <div class="contact-grid">

    <!-- Email con botón de copiar -->

      </svg>
      <span id="emailBtnText">gigena.esteban@icloud.com</span>
      <svg id="copyIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;opacity:0.7;">
        <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
    </button>
    <div class="copy-feedback" id="copyFeedback">¡Email copiado al portapapeles!</div>

    <!-- WhatsApp -->
    <a class="btn btn-whatsapp" href="https://wa.me/5491130594217" target="_blank" rel="noopener">

        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/>

    <!-- LinkedIn -->
    <a class="btn btn-linkedin" href="https://www.linkedin.com/in/estebangigenabasombrio" target="_blank" rel="noopener">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="color:#60a5fa">
        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
      </svg>
      LinkedIn
    </a>

  </div>

  <p class="footer">© 2026 Esteban Gigena</p>

</div>

<script>
  function copyEmail() {
    const email = 'gigena.esteban@icloud.com';
    navigator.clipboard.writeText(email).then(() => {
      const feedback = document.getElementById('copyFeedback');
      const btnText = document.getElementById('emailBtnText');
      btnText.textContent = '¡Copiado!';
      feedback.classList.add('show');
      setTimeout(() => {
        btnText.textContent = email;
        feedback.classList.remove('show');
      }, 2000);
    });
  }
</script>

</body>
</html>
